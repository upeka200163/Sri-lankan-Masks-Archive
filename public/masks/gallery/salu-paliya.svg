<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_salu-paliya" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="spotlight_salu-paliya" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e4e4e7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_salu-paliya" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_salu-paliya)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_salu-paliya)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Salu Paliya</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_salu-paliya)">
    <!-- Side Ears / Wings -->
    
      <!-- Flowing Shawl Folds -->
      <path d="M260,400 Q200,480 250,560 Q280,480 260,400 Z" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="4"/>
      <path d="M740,400 Q800,480 750,560 Q720,480 740,400 Z" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="4"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Draped Sacred White Cloth Hood -->
      <path d="M300,280 C320,100 680,100 700,280 C630,220 370,220 300,280 Z" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="6"/>
      <path d="M420,180 Q500,120 580,180" fill="none" stroke="#a1a1aa" stroke-width="4"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#f5d0b5" stroke="#e4e4e7" stroke-width="8"/>

    <!-- Eyes -->
    
      <ellipse cx="410" cy="420" rx="38" ry="28" fill="#ffffff" stroke="#71717a" stroke-width="4"/>
      <circle cx="410" cy="420" r="16" fill="#27272a"/>
      <ellipse cx="590" cy="420" rx="38" ry="28" fill="#ffffff" stroke="#71717a" stroke-width="4"/>
      <circle cx="590" cy="420" r="16" fill="#27272a"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#e4e4e7" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <!-- Gentle Benevolent Smile -->
      <path d="M420,530 Q500,575 580,530" fill="none" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
    
  </g>
</svg>