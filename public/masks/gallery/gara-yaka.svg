<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_gara-yaka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#0e0603"/>
    </linearGradient>
    <radialGradient id="spotlight_gara-yaka" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_gara-yaka" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_gara-yaka)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_gara-yaka)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Gara Yaka</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_gara-yaka)">
    <!-- Side Ears / Wings -->
    
      <!-- Large Round Disc Earrings (Kundalabharana) -->
      <circle cx="230" cy="480" r="95" fill="#d97706" stroke="#f59e0b" stroke-width="8"/>
      <circle cx="230" cy="480" r="60" fill="#92400e" stroke="#fef08a" stroke-width="4"/>
      <circle cx="230" cy="480" r="25" fill="#b91c1c"/>
      <circle cx="770" cy="480" r="95" fill="#d97706" stroke="#f59e0b" stroke-width="8"/>
      <circle cx="770" cy="480" r="60" fill="#92400e" stroke="#fef08a" stroke-width="4"/>
      <circle cx="770" cy="480" r="25" fill="#b91c1c"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Three Cobra Hoods -->
      <path d="M400,160 C380,80 320,80 310,180 C360,220 400,240 400,260 Z" fill="#15803d" stroke="#f59e0b" stroke-width="6"/>
      <path d="M600,160 C620,80 680,80 690,180 C640,220 600,240 600,260 Z" fill="#15803d" stroke="#f59e0b" stroke-width="6"/>
      <path d="M500,100 C450,30 550,30 500,100 Z" fill="#b91c1c"/>
      <path d="M500,240 C430,130 450,60 500,60 C550,60 570,130 500,240 Z" fill="#16a34a" stroke="#f59e0b" stroke-width="8"/>
      <!-- Cobra Eyes -->
      <circle cx="485" cy="110" r="6" fill="#fef08a"/>
      <circle cx="515" cy="110" r="6" fill="#fef08a"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#b91c1c" stroke="#f59e0b" stroke-width="8"/>

    <!-- Eyes -->
    
      <!-- Bulging Gara Eyes -->
      <ellipse cx="400" cy="440" rx="55" ry="50" fill="#ffffff" stroke="#991b1b" stroke-width="8"/>
      <circle cx="400" cy="440" r="28" fill="#1c1917"/>
      <circle cx="410" cy="430" r="8" fill="#ffffff"/>
      <ellipse cx="600" cy="440" rx="55" ry="50" fill="#ffffff" stroke="#991b1b" stroke-width="8"/>
      <circle cx="600" cy="440" r="28" fill="#1c1917"/>
      <circle cx="610" cy="430" r="8" fill="#ffffff"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <!-- Broad Exorcist Grin with Fangs -->
      <path d="M350,560 Q500,660 650,560 Q500,520 350,560 Z" fill="#7f1d1d" stroke="#f59e0b" stroke-width="6"/>
      <!-- Fangs -->
      <polygon points="380,560 410,560 395,640" fill="#ffffff" stroke="#e5e7eb" stroke-width="3"/>
      <polygon points="590,560 620,560 605,640" fill="#ffffff" stroke="#e5e7eb" stroke-width="3"/>
      <polygon points="440,570 460,570 450,610" fill="#ffffff"/>
      <polygon points="540,570 560,570 550,610" fill="#ffffff"/>
      <!-- Protruding Tongue -->
      <path d="M460,590 Q500,680 540,590 Z" fill="#ef4444"/>
    
  </g>
</svg>