<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_vedi-kolam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="spotlight_vedi-kolam" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4ade80" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_vedi-kolam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_vedi-kolam)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_vedi-kolam)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Vedi Kolam</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_vedi-kolam)">
    <!-- Side Ears / Wings -->
    
      <ellipse cx="270" cy="460" rx="30" ry="50" fill="#92400e" stroke="#22c55e" stroke-width="4"/>
      <ellipse cx="730" cy="460" rx="30" ry="50" fill="#92400e" stroke="#22c55e" stroke-width="4"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Forest Hunter Headdress & Feather Plumes -->
      <path d="M350,260 Q500,140 650,260 Z" fill="#166534" stroke="#4ade80" stroke-width="6"/>
      <path d="M450,160 L430,60 L470,140 Z" fill="#22c55e"/>
      <path d="M500,140 L500,40 L520,130 Z" fill="#facc15"/>
      <path d="M550,160 L570,60 L530,140 Z" fill="#ef4444"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#78350f" stroke="#4ade80" stroke-width="8"/>

    <!-- Eyes -->
    
      <ellipse cx="410" cy="420" rx="36" ry="32" fill="#ffffff" stroke="#14532d" stroke-width="5"/>
      <circle cx="410" cy="420" r="16" fill="#0f172a"/>
      <ellipse cx="590" cy="420" rx="36" ry="32" fill="#ffffff" stroke="#14532d" stroke-width="5"/>
      <circle cx="590" cy="420" r="16" fill="#0f172a"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#4ade80" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <path d="M420,530 Q500,565 580,530" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <!-- Rustic Hunter Beard Texture -->
      <path d="M400,570 Q500,670 600,570" fill="#451a03" stroke="#22c55e" stroke-width="3"/>
    
  </g>
</svg>