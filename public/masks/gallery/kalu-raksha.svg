<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_kalu-raksha" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="spotlight_kalu-raksha" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_kalu-raksha" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_kalu-raksha)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_kalu-raksha)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Kalu Raksha</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_kalu-raksha)">
    <!-- Side Ears / Wings -->
    
      <path d="M280,420 C180,360 190,520 280,540 Z" fill="#18181b" stroke="#dc2626" stroke-width="5"/>
      <path d="M720,420 C820,360 810,520 720,540 Z" fill="#18181b" stroke="#dc2626" stroke-width="5"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Midnight Raven Cobra Crest -->
      <path d="M500,70 C430,160 440,240 500,240 C560,240 570,160 500,70 Z" fill="#09090b" stroke="#ef4444" stroke-width="6"/>
      <path d="M380,140 C340,200 420,250 420,250" fill="none" stroke="#ef4444" stroke-width="6"/>
      <path d="M620,140 C660,200 580,250 580,250" fill="none" stroke="#ef4444" stroke-width="6"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#18181b" stroke="#ef4444" stroke-width="8"/>

    <!-- Eyes -->
    
      <ellipse cx="405" cy="420" rx="46" ry="42" fill="#fef2f2" stroke="#dc2626" stroke-width="7"/>
      <circle cx="405" cy="420" r="22" fill="#000000"/>
      <ellipse cx="595" cy="420" rx="46" ry="42" fill="#fef2f2" stroke="#dc2626" stroke-width="7"/>
      <circle cx="595" cy="420" r="22" fill="#000000"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#ef4444" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <path d="M370,540 Q500,630 630,540 Z" fill="#450a0a" stroke="#dc2626" stroke-width="6"/>
      <polygon points="390,540 420,540 405,620" fill="#ffffff"/>
      <polygon points="580,540 610,540 595,620" fill="#ffffff"/>
    
  </g>
</svg>