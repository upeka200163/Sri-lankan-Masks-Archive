<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_pandam-paliya" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1f05"/>
      <stop offset="100%" stop-color="#120701"/>
    </linearGradient>
    <radialGradient id="spotlight_pandam-paliya" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_pandam-paliya" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_pandam-paliya)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_pandam-paliya)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Pandam Paliya</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_pandam-paliya)">
    <!-- Side Ears / Wings -->
    
      <circle cx="250" cy="460" r="50" fill="#92400e" stroke="#f59e0b" stroke-width="6"/>
      <circle cx="750" cy="460" r="50" fill="#92400e" stroke="#f59e0b" stroke-width="6"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Twin Blazing Torches Headdress -->
      <g transform="translate(320, 60)">
        <rect x="0" y="80" width="30" height="90" fill="#78350f" stroke="#f59e0b" stroke-width="4"/>
        <path d="M15,0 Q-15,60 15,80 Q45,60 15,0 Z" fill="#f59e0b" stroke="#ef4444" stroke-width="4"/>
      </g>
      <g transform="translate(650, 60)">
        <rect x="0" y="80" width="30" height="90" fill="#78350f" stroke="#f59e0b" stroke-width="4"/>
        <path d="M15,0 Q-15,60 15,80 Q45,60 15,0 Z" fill="#f59e0b" stroke="#ef4444" stroke-width="4"/>
      </g>
      <path d="M380,240 Q500,160 620,240 Z" fill="#b45309" stroke="#f59e0b" stroke-width="6"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#d97706" stroke="#f59e0b" stroke-width="8"/>

    <!-- Eyes -->
    
      <ellipse cx="410" cy="420" rx="45" ry="40" fill="#ffffff" stroke="#78350f" stroke-width="6"/>
      <circle cx="410" cy="420" r="20" fill="#1e1b4b"/>
      <ellipse cx="590" cy="420" rx="45" ry="40" fill="#ffffff" stroke="#78350f" stroke-width="6"/>
      <circle cx="590" cy="420" r="20" fill="#1e1b4b"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <!-- Animated Wide Smirk -->
      <path d="M390,530 Q500,610 610,530 Z" fill="#7f1d1d" stroke="#fef08a" stroke-width="4"/>
      <rect x="440" y="535" width="30" height="20" fill="#ffffff"/>
      <rect x="530" y="535" width="30" height="20" fill="#ffffff"/>
    
  </g>
</svg>