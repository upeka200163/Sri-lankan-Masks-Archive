<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_nari-latha" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1f020a"/>
    </linearGradient>
    <radialGradient id="spotlight_nari-latha" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_nari-latha" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_nari-latha)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_nari-latha)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Nari Latha</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_nari-latha)">
    <!-- Side Ears / Wings -->
    
      <!-- Floral Petal Studs -->
      <circle cx="260" cy="460" r="42" fill="#f43f5e" stroke="#fbbf24" stroke-width="6"/>
      <circle cx="740" cy="460" r="42" fill="#f43f5e" stroke="#fbbf24" stroke-width="6"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Mythical Floral Petal Creeper Filigree -->
      <path d="M350,260 Q500,80 650,260 Q500,200 350,260 Z" fill="#f43f5e" stroke="#fecdd3" stroke-width="6"/>
      <circle cx="500" cy="140" r="24" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
      <!-- Surrounding Blossoms -->
      <circle cx="420" cy="180" r="16" fill="#fda4af"/>
      <circle cx="580" cy="180" r="16" fill="#fda4af"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#ffe4e6" stroke="#f43f5e" stroke-width="8"/>

    <!-- Eyes -->
    
      <!-- Serene Almond Lotus Eyes -->
      <path d="M370,410 Q410,380 450,410 Q410,430 370,410 Z" fill="#ffffff" stroke="#881337" stroke-width="4"/>
      <circle cx="410" cy="410" r="14" fill="#0f172a"/>
      <path d="M550,410 Q590,380 630,410 Q590,430 550,410 Z" fill="#ffffff" stroke="#881337" stroke-width="4"/>
      <circle cx="590" cy="410" r="14" fill="#0f172a"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <!-- Delicate Rose Tinted Smile -->
      <path d="M440,530 Q500,560 560,530 Q500,545 440,530 Z" fill="#e11d48"/>
    
  </g>
</svg>