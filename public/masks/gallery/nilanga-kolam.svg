<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_nilanga-kolam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>
    <radialGradient id="spotlight_nilanga-kolam" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_nilanga-kolam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_nilanga-kolam)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_nilanga-kolam)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Nilanga Kolam</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_nilanga-kolam)">
    <!-- Side Ears / Wings -->
    
      <!-- Gold Kundala Ear Ornaments -->
      <circle cx="260" cy="470" r="45" fill="#facc15" stroke="#ca8a04" stroke-width="6"/>
      <circle cx="740" cy="470" r="45" fill="#facc15" stroke="#ca8a04" stroke-width="6"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Royal Aristocrat Chieftain Crown (Thoppiya) -->
      <path d="M340,250 L500,100 L660,250 Z" fill="#b45309" stroke="#facc15" stroke-width="8"/>
      <rect x="470" y="70" width="60" height="30" fill="#eab308" stroke="#ca8a04" stroke-width="4"/>
      <circle cx="500" cy="70" r="14" fill="#dc2626"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#fed7aa" stroke="#eab308" stroke-width="8"/>

    <!-- Eyes -->
    
      <ellipse cx="410" cy="400" rx="36" ry="30" fill="#ffffff" stroke="#78350f" stroke-width="5"/>
      <circle cx="410" cy="400" r="16" fill="#1c1917"/>
      <ellipse cx="590" cy="400" rx="36" ry="30" fill="#ffffff" stroke="#78350f" stroke-width="5"/>
      <circle cx="590" cy="400" r="16" fill="#1c1917"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#eab308" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <!-- Aristocratic Mustache & Pompous Expression -->
      <path d="M370,490 Q500,520 500,480 Q500,520 630,490 Q500,540 370,490 Z" fill="#1c1917"/>
      <path d="M440,540 Q500,565 560,540" fill="none" stroke="#be123c" stroke-width="6"/>
    
  </g>
</svg>