<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad_kalu-kumara" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="spotlight_kalu-kumara" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_kalu-kumara" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad_kalu-kumara)"/>
  <rect width="1000" height="1000" fill="url(#spotlight_kalu-kumara)"/>

  <!-- Museum Exhibit Pedestal & Frame -->
  <g opacity="0.9">
    <rect x="380" y="800" width="240" height="150" rx="10" fill="#14110f" stroke="#292524" stroke-width="4"/>
    <rect x="485" y="680" width="30" height="130" fill="#292524"/>
    <!-- Plaque -->
    <rect x="400" y="835" width="200" height="65" rx="6" fill="#271c11" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="863" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7" text-anchor="middle">Kalu Kumara</text>
    <text x="500" y="885" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Curatorial Archive Record</text>
  </g>

  <!-- Main Mask Artifact -->
  <g filter="url(#shadow_kalu-kumara)">
    <!-- Side Ears / Wings -->
    
      <ellipse cx="260" cy="460" rx="40" ry="70" fill="#334155" stroke="#818cf8" stroke-width="4"/>
      <ellipse cx="740" cy="460" rx="40" ry="70" fill="#334155" stroke="#818cf8" stroke-width="4"/>
    

    <!-- Upper Headdress Crest -->
    
      <!-- Royal Midnight Diadem -->
      <path d="M360,250 L500,100 L640,250 Z" fill="#312e81" stroke="#818cf8" stroke-width="6"/>
      <circle cx="500" cy="100" r="18" fill="#c7d2fe" stroke="#6366f1" stroke-width="4"/>
      <circle cx="430" cy="180" r="12" fill="#818cf8"/>
      <circle cx="570" cy="180" r="12" fill="#818cf8"/>
    

    <!-- Face Oval Structure -->
    <ellipse cx="500" cy="470" rx="170" ry="220" fill="#1e293b" stroke="#818cf8" stroke-width="8"/>

    <!-- Eyes -->
    
      <ellipse cx="410" cy="430" rx="42" ry="32" fill="#e2e8f0" stroke="#475569" stroke-width="5"/>
      <circle cx="410" cy="430" r="18" fill="#020617"/>
      <ellipse cx="590" cy="430" rx="42" ry="32" fill="#e2e8f0" stroke="#475569" stroke-width="5"/>
      <circle cx="590" cy="430" r="18" fill="#020617"/>
      <!-- Arched Midnight Eyebrows -->
      <path d="M360,390 Q410,360 460,390" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
      <path d="M540,390 Q590,360 640,390" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    

    <!-- Nose Ridge -->
    <path d="M500,420 L480,480 L520,480 Z" fill="none" stroke="#818cf8" stroke-width="6" stroke-linejoin="round"/>

    <!-- Mouth & Fangs -->
    
      <path d="M430,550 Q500,580 570,550" fill="none" stroke="#be123c" stroke-width="10" stroke-linecap="round"/>
      <!-- Royal Mustache -->
      <path d="M400,530 Q500,550 500,520 Q500,550 600,530 Q500,570 400,530 Z" fill="#0f172a"/>
    
  </g>
</svg>